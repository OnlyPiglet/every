name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # System Ruby (2.6) is the compatibility floor — test against it.
      - name: Syntax check
        run: /usr/bin/ruby -cw bin/every lib/every.rb lib/every/*.rb
      - name: Unit tests
        run: for f in test/*_test.rb; do echo "== $f =="; /usr/bin/ruby "$f" || exit 1; done

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: ruby -cw bin/every lib/every.rb lib/every/*.rb
      - name: Unit tests
        run: for f in test/*_test.rb; do echo "== $f =="; ruby "$f" || exit 1; done
      # Validate every generated OnCalendar expression with real systemd.
      # (Same script the `docker` workflow runs in a pinned container.)
      - name: systemd-analyze calendar validation
        run: ruby test/systemd_calendar_check.rb
